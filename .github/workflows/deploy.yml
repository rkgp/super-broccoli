# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (fails if the content file has a mistake)
        run: node build.mjs --variant=line --route=galaxy   # chosen look and route (2026-11-17); --noindex removed at launch on jorritvanderveen.com (2026-11-25)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
